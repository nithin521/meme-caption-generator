server:
  port: ${PORT:8080}

spring:
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/memeapp?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:root}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.MySQLDialect
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

app:
  jwt:
    secret: ${JWT_SECRET:change-this-to-a-long-random-secret-in-production-please-change-me}
    expiration-ms: ${JWT_EXPIRATION_MS:86400000}   # 24h
  inference:
    base-url: ${INFERENCE_SERVICE_URL:http://localhost:8000}
  cors:
    allowed-origins: ${ALLOWED_ORIGINS:http://localhost:5173}
