version: "3.9"

services:
  mysql:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: memeapp
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot"]
      interval: 5s
      timeout: 5s
      retries: 10

  inference-service:
    build: ./inference-service
    restart: unless-stopped
    ports:
      - "8000:8000"
    volumes:
      # Mount your trained model directory here (produced by meme_caption_pipeline.py)
      - ./inference-service/model_output:/app/model_output
    environment:
      MODEL_DIR: /app/model_output

  backend:
    build: ./backend
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
      inference-service:
        condition: service_started
    ports:
      - "8080:8080"
    environment:
      DB_URL: jdbc:mysql://mysql:3306/memeapp?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
      DB_USERNAME: root
      DB_PASSWORD: root
      INFERENCE_SERVICE_URL: http://inference-service:8000
      JWT_SECRET: local-dev-secret-change-me-please-1234567890
      ALLOWED_ORIGINS: http://localhost:5173,http://localhost:80
    volumes:
      - backend_uploads:/app/uploads

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_BASE_URL: http://localhost:8080
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "5173:80"

volumes:
  mysql_data:
  backend_uploads:
